[project]
name = "stegoarena"
version = "0.1.0"
description = "Co-evolving steganography benchmark for agents (Archil sandboxes)"
authors = [
    { name = "husseinhirani", email = "hiraniusaco@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7.0",
    "archil>=0.21.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "keenable>=0.1.3",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
stegoarena = "stegoarena:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
