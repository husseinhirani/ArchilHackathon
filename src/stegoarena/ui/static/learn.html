<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Stego</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3140; --text:#e6edf3; --muted:#8b949e; --accent:#7c9cff; --good:#3fb950; --bad:#f85149; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  a { color:var(--accent); }
  header { display:flex; align-items:baseline; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; } header .right { margin-left:auto; font-size:12px; color:var(--muted); }
  main { padding:18px 20px; max-width:1300px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  .panel h2 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .muted { color:var(--muted); } .mono { font-family:var(--mono); }
  button, input, select { font:inherit; color:var(--text); }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); } button.on { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#0b1020; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], select { background:#0d1117; border:1px solid var(--line); border-radius:7px; padding:8px 10px; width:100%; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .picker { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .picker a { text-decoration:none; color:inherit; } .picker .panel:hover { border-color:var(--accent); }
  .layout { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; }
  .stepper { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .stepper button { text-transform:capitalize; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .imgs figure { margin:0; } .imgs img, canvas { max-width:100%; height:auto; image-rendering:pixelated; border:1px solid var(--line); border-radius:6px; background:#0d1117; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; }
  .out { font-family:var(--mono); font-size:12px; white-space:pre-wrap; word-break:break-word; margin-top:8px; }
  .found { color:var(--good); font-weight:700; } .bad { color:var(--bad); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .chat { display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow:auto; margin-bottom:10px; }
  .msg { padding:8px 10px; border-radius:8px; background:var(--panel2); white-space:pre-wrap; }
  .msg.me { background:#24304d; align-self:flex-end; }
  svg { width:100%; height:40px; background:#0d1117; border:1px solid var(--line); border-radius:6px; }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>📚 Learn stego</h1><span class="muted">Hands-on lessons with an AI tutor</span>
  <span class="right"><a href="/hs">🫣 Hide &amp; Seek</a> · <a href="/">Lab</a></span></header>
<main id="view"></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
};
const state = { level: null, step: "concept", hide: null, practice: null, photo: null };

async function picker() {
  const d = await api("/api/learn/lessons");
  $("#view").innerHTML = `<div class="picker">${Object.entries(d.lessons).map(([k, l]) =>
    `<a href="/learn/${k}"><div class="panel"><h2>${k}</h2><b>${esc(l.title)}</b></div></a>`).join("")}</div>
    <p class="muted">Tutor: ${d.tutor === "claude" ? "Claude" : "scripted hints (no API key)"}</p>`;
}

async function lesson(level) {
  const d = await api("/api/learn/lessons");
  state.level = level; const L = d.lessons[level]; state.L = L;
  $("#view").innerHTML = `<div class="layout"><div>
      <div class="stepper" id="stepper">${d.steps.map((s) => `<button data-s="${s}">${s}</button>`).join("")}</div>
      <div class="panel" id="body"></div></div>
    <div class="panel"><h2>AI tutor <span class="muted" style="text-transform:none">(${d.tutor === "claude" ? "Claude" : "scripted hints"})</span></h2>
      <div class="chat" id="chat"><div class="msg">Ask me anything about this step.</div></div>
      <div class="row"><input type="text" id="q" placeholder="Ask for a hint…" style="flex:1"><button id="ask">Ask</button></div></div></div>`;
  document.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => go(b.dataset.s));
  $("#ask").onclick = askTutor; $("#q").onkeydown = (e) => e.key === "Enter" && askTutor();
  go("concept");
}

function go(step) {
  state.step = step;
  document.querySelectorAll("[data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === step));
  ({ concept, hide, signals, practice, graduate })[step]();
}

async function askTutor() {
  const q = $("#q").value.trim(); if (!q) return;
  const sid = state.practice?.meta.sid || state.hide?.meta.sid;
  const chat = $("#chat"); $("#q").value = "";
  chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div>`);
  if (!sid) { chat.insertAdjacentHTML("beforeend", `<div class="msg">Start the hide or practice step first, so I have an image to look at.</div>`); return; }
  try {
    const r = await api(`/api/learn/s/${sid}/tutor`, { message: q, step: state.step });
    chat.insertAdjacentHTML("beforeend", `<div class="msg">${esc(r.reply)}</div>`);
  } catch (e) { chat.insertAdjacentHTML("beforeend", `<div class="msg bad">${esc(e.message)}</div>`); }
  chat.scrollTop = chat.scrollHeight;
}

function concept() {
  const L = state.L;
  $("#body").innerHTML = `<h2>${esc(L.title)}</h2>${L.concept.map((p) => `<p>${esc(p)}</p>`).join("")}
    <h2>How it's done in the wild</h2>${L.in_the_wild.map((p) => `<p>${esc(p)}</p>`).join("")}
    <button class="primary" onclick="go('hide')">Next: hide something</button>`;
}

function hide() {
  const h = state.hide;
  $("#body").innerHTML = `<h2>Hide a secret yourself</h2>
    <label>Photo (optional)</label><input type="file" id="file" accept="image/*">
    <label>Secret</label><input type="text" id="msg" maxlength="120" value="${esc(h?.truth?.message || "")}" placeholder="meet me at the fountain">
    <div class="row" style="margin-top:10px"><button class="primary" id="go">Hide it</button><span class="muted" id="err"></span></div><div id="res"></div>`;
  $("#file").onchange = () => {
    const f = $("#file").files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"), k = Math.min(1, 1024 / Math.max(img.width, img.height));
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); state.photo = c.toDataURL("image/png"); };
    img.src = URL.createObjectURL(f);
  };
  $("#go").onclick = async () => {
    $("#go").disabled = true; $("#err").textContent = "";
    try { state.hide = await api(`/api/learn/${state.level}/hide`, { message: $("#msg").value, photo_b64: state.photo }); showHide(); }
    catch (e) { $("#err").textContent = e.message; }
    $("#go").disabled = false;
  };
  if (h) showHide();
}

function showHide() {
  const h = state.hide, t = h.truth, s = t.spec;
  $("#res").innerHTML = `<div class="imgs">
      <figure><img src="${h.cover}"><figcaption class="muted">original</figcaption></figure>
      <figure><img src="${h.image}"><figcaption class="muted">with your secret</figcaption></figure>
      <figure><img src="${h.diff}"><figcaption class="muted">every changed pixel, in white</figcaption></figure></div>
    <div class="card mono">${esc(s.technique)} · channels ${esc(s.channels.join(""))} · bit ${s.bit_plane} · ${esc(s.order)} · cipher ${esc(s.cipher)}${t.key ? ` · key “${esc(t.key)}” (${esc(s.key_source)})` : ""}</div>
    <button class="primary" onclick="go('signals')">Next: what gives it away</button>`;
}

// Row profile: share of neighbouring pixels whose bit 0 differs, per band of rows. A fixed 0..0.6
// scale keeps channels and images comparable; the dashed line at 0.5 is what random bits give.
function spark(vals) {
  const mx = 0.6, w = 400, h = 40, y = (v) => (h - (Math.min(v, mx) / mx) * (h - 4) - 2).toFixed(1);
  const pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1) * w).toFixed(1)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="#6e7681" stroke-dasharray="4 4"/>` +
    `<polyline fill="none" stroke="#7c9cff" stroke-width="1.5" points="${pts}"/></svg>`;
}

// One image's measurements: chi per channel, file structure, and the row profile for all three channels.
function readings(name, d) {
  const f = d.file;
  return `<div class="card"><b>${esc(name)}</b>
    <div class="mono">chi  R ${d.chi.R} · G ${d.chi.G} · B ${d.chi.B}</div>
    <div class="mono">chunks: ${esc(f.chunks.map((c) => c.type).join(" "))}${Object.keys(f.text).length ? "<br>text: " + esc(JSON.stringify(f.text)) : ""}<br>bytes after IEND: ${f.trailer_bytes}</div>
    <div class="muted" style="margin-top:6px">row profile, bit 0 (dashed line = random bits)</div>
    ${["R", "G", "B"].map((c) => `<div class="row" style="flex-wrap:nowrap;gap:6px"><span class="mono">${c}</span><div style="flex:1">${spark(d.row_profile[c])}</div></div>`).join("")}</div>`;
}

const planeViewer = () => `<canvas id="cv"></canvas>
  <div class="row"><span class="muted">Bit-plane viewer</span>${["RGB", "R", "G", "B"].map((c) => `<button data-ch="${c}">${c}</button>`).join("")}
    ${[0, 1, 2].map((p) => `<button data-pl="${p}">bit ${p}</button>`).join("")}<button data-orig>original</button></div>`;

async function signals() {
  if (!state.hide) { $("#body").innerHTML = `<p>Hide something first, then compare the measurements.</p><button onclick="go('hide')">Go hide</button>`; return; }
  $("#body").innerHTML = `<p class="muted">measuring…</p>`;
  const sg = await api(`/api/learn/s/${state.hide.meta.sid}/signals`);
  $("#body").innerHTML = `<h2>Signals: before and after</h2><div class="imgs">${readings("original", sg.cover)}${readings("with secret", sg.stego)}</div>
    ${state.L.signals.map((s) => `<div class="card"><b>${esc(s.name)}</b><div>${esc(s.what)}</div><div class="muted">${esc(s.why)}</div><div class="mono muted">${esc(s.tool)}</div></div>`).join("")}
    ${planeViewer()}
    <p><button class="primary" onclick="go('practice')">Next: crack a mystery image</button></p>`;
  planes(state.hide.image);
}

function planes(src) {
  const img = new Image(); let ch = "RGB", pl = 0, pix, ctx;
  const mark = () => document.querySelectorAll("[data-ch],[data-pl]").forEach((b) => b.classList.toggle("on", b.dataset.ch === ch || b.dataset.pl === String(pl)));
  const draw = () => {
    const idx = { R: [0], G: [1], B: [2], RGB: [0, 1, 2] }[ch], out = new ImageData(pix.width, pix.height), d = out.data, s = pix.data;
    for (let i = 0; i < s.length; i += 4) {
      if (idx.length === 3) for (const j of idx) d[i + j] = ((s[i + j] >> pl) & 1) * 255;
      else d[i] = d[i + 1] = d[i + 2] = ((s[i + idx[0]] >> pl) & 1) * 255;
      d[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  };
  img.onload = () => { const cv = $("#cv"); cv.width = img.width; cv.height = img.height; ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0); pix = ctx.getImageData(0, 0, img.width, img.height); };  // starts on the original
  img.src = src;
  document.querySelectorAll("[data-ch]").forEach((b) => b.onclick = () => { ch = b.dataset.ch; if (pix) { draw(); mark(); } });
  document.querySelectorAll("[data-pl]").forEach((b) => b.onclick = () => { pl = +b.dataset.pl; if (pix) { draw(); mark(); } });
  $("[data-orig]").onclick = () => { if (pix) { ctx.putImageData(pix, 0, 0); document.querySelectorAll("[data-ch],[data-pl]").forEach((b) => b.classList.remove("on")); } };
}

async function practice() {
  if (!state.practice) state.practice = await api(`/api/learn/${state.level}/practice`, {});  // POST: creates the mystery image
  const p = state.practice, sid = p.meta.sid;
  $("#body").innerHTML = `<h2>Crack the mystery image</h2>
    <p class="muted">Same tools as the signals step, but there's no original to compare against this time.</p>
    ${planeViewer()}
    <div id="psig"><p class="muted">measuring…</p></div>
    <h2 style="margin-top:14px">Decode</h2>
    <div class="grid2">
      <div><label>Technique</label><select id="d-tech"><option>lsb</option><option>alpha</option><option>palette</option><option>dct</option></select></div>
      <div><label>Channels</label><select id="d-ch"><option>R,G,B</option><option>R</option><option>G</option><option>B</option><option>R,G</option><option>R,B</option><option>G,B</option></select></div>
      <div><label>Bit plane</label><select id="d-bp"><option>0</option><option>1</option><option>2</option></select></div>
      <div><label>Order</label><select id="d-ord"><option>sequential</option><option>prng</option></select></div>
      <div><label>Cipher</label><select id="d-ci"><option>none</option><option>xor</option><option>aes</option></select></div>
      <div><label>Key</label><input type="text" id="d-key" placeholder="(none)"></div></div>
    <div class="row" style="margin-top:10px"><button id="dtry">Try decode</button><button id="dwl">Try every wordlist key</button></div>
    <div class="out" id="dout"></div>
    <label>Your answer</label><div class="row"><input type="text" id="ans" style="flex:1"><button class="primary" id="sub">Submit</button><button id="gu">Give up</button></div>
    <div class="out" id="aout"></div>`;
  planes(p.image);
  api(`/api/learn/s/${sid}/signals`).then((sg) => { $("#psig") && ($("#psig").innerHTML = readings("mystery image", sg.stego)); })
    .catch((e) => { $("#psig") && ($("#psig").textContent = e.message); });
  const spec = () => ({ technique: $("#d-tech").value, channels: $("#d-ch").value.split(","), bit_plane: +$("#d-bp").value, order: $("#d-ord").value, cipher: $("#d-ci").value });
  const dec = async (wordlist) => {
    $("#dout").textContent = "decoding…";
    try {
      const r = await api(`/api/learn/s/${sid}/try`, { spec: spec(), key: $("#d-key").value || null, wordlist });
      $("#dout").innerHTML = r.found ? `<span class="found">Found: ${esc(r.message)}</span>${r.key ? ` (key ${esc(r.key)})` : ""}` : r.error ? esc(r.error) : "nothing with those settings";
      if (r.found) $("#ans").value = r.message;
    } catch (e) { $("#dout").textContent = e.message; }
  };
  $("#dtry").onclick = () => dec(false); $("#dwl").onclick = () => dec(true);
  $("#sub").onclick = async () => {
    const r = await api(`/api/learn/s/${sid}/check`, { message: $("#ans").value });
    $("#aout").innerHTML = r.correct ? `<span class="found">Correct! </span><button class="primary" onclick="go('graduate')">Next</button>` : r.decoy ? `<span class="bad">That's a decoy.</span>` : "Not it. Ask the tutor for a nudge.";
  };
  $("#gu").onclick = async () => {
    const r = await api(`/api/learn/s/${sid}/giveup`, {});
    $("#aout").innerHTML = `The secret was <b>${esc(r.reveal.message)}</b> (${esc(r.reveal.spec.technique)}, channels ${esc(r.reveal.spec.channels.join(""))}, bit ${r.reveal.spec.bit_plane}, ${esc(r.reveal.spec.order)}, ${esc(r.reveal.spec.cipher)}${r.reveal.key ? `, key ${esc(r.reveal.key)}` : ""}). <button onclick="go('graduate')">Next</button>`;
  };
}

function graduate() {
  $("#body").innerHTML = `<h2>Ready for a real race?</h2>
    <p>Hide a secret at the <b>${esc(state.level)}</b> level. Send the link to a friend: when they press start, the AI finder starts hunting too.</p>
    <label>Secret (max 120 characters)</label><input type="text" id="gmsg" maxlength="120" placeholder="meet me at the fountain at 7">
    <label>Hint for the seekers (optional; the AI sees it too)</label><input type="text" id="ghint" maxlength="200">
    <div class="row" style="margin-top:10px"><button class="primary" id="ggo">Create the race</button><span class="muted" id="gerr"></span></div>
    <div id="gres"></div>`;
  $("#ggo").onclick = async () => {
    const message = $("#gmsg").value.trim();
    if (!message) { $("#gerr").textContent = "type a secret first"; return; }
    $("#ggo").disabled = true; $("#gerr").textContent = "";
    try {
      const r = await api("/api/c", { message, level: state.level, hint: $("#ghint").value });
      const play = location.origin + r.play_url;
      $("#gres").innerHTML = `<div class="card"><label>Challenge link for your friend</label><input type="text" readonly value="${esc(play)}">
        <div class="row" style="margin-top:8px"><a href="${esc(r.watch_url)}">Watch the race →</a><span class="muted">or</span><a href="${esc(r.play_url)}">play it yourself</a></div></div>`;
    } catch (e) { $("#gerr").textContent = e.message; }
    $("#ggo").disabled = false;
  };
}

const m = location.pathname.match(/^\/learn\/(easy|medium|hard)/);
m ? lesson(m[1]) : picker();
</script>
</body>
</html>
