<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StegoArena · Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/arena.css">
<style>
  .picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .picker a { color: inherit; } .picker a:hover { text-decoration: none; }
  .lesson { height: 100%; display: flex; flex-direction: column; gap: 8px; transition: border-color .12s, transform .12s; }
  .lesson:hover { border-color: var(--accent); transform: translateY(-1px); }
  .lesson h3 { font-size: 17px; }
  .lesson .teaser { color: var(--muted); font-size: 13px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lesson .go { color: var(--accent-hi); font-weight: 500; font-size: 13px; }
  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .steps { display: flex; gap: 0; margin-bottom: 14px; overflow-x: auto; }
  .steps button { flex: 1; min-width: 110px; border-radius: 0; border-right-width: 0; justify-content: flex-start; gap: 8px; text-transform: capitalize; color: var(--muted); }
  .steps button:first-child { border-radius: 8px 0 0 8px; } .steps button:last-child { border-radius: 0 8px 8px 0; border-right-width: 1px; }
  .steps button i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--line2); color: var(--text); font-size: 11px; font-weight: 600; }
  .steps button.on { color: var(--text); background: var(--panel2); border-color: var(--line2); box-shadow: inset 0 -2px 0 var(--accent); }
  .steps button.on i { background: var(--accent); color: var(--accent-ink); }
  .body h3 { font-size: 18px; margin: 0 0 10px; }
  .body h3 + h3, .body .sec { margin-top: 18px; }
  .body p { max-width: 72ch; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; }
  .imgs img, canvas { max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); }
  .sig { margin: 8px 0; }
  .sig b { display: block; } .sig .tool { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
  .reading { margin: 8px 0; } .reading .mono { font-size: 12px; }
  .chat { display: flex; flex-direction: column; gap: 8px; max-height: 56vh; overflow: auto; margin-bottom: 10px; }
  .msg { padding: 8px 11px; border-radius: 10px 10px 10px 3px; background: var(--panel2); white-space: pre-wrap; max-width: 92%; font-size: 13px; line-height: 1.5; }
  .msg.me { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); align-self: flex-end; border-radius: 10px 10px 3px 10px; }
  .msg.bad { color: var(--accent-hi); }
  svg.spark { width: 100%; height: 40px; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; display: block; }
  .next { margin-top: 18px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="topbar">
  <a class="brand" href="/"><span class="mark"><svg viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" fill="#fff"/><rect x="8" y="1" width="5" height="5" rx="1" fill="#fff" opacity=".45"/><rect x="1" y="8" width="5" height="5" rx="1" fill="#fff" opacity=".45"/><rect x="8" y="8" width="5" height="5" rx="1" fill="#fff"/></svg></span>StegoArena</a>
  <div class="nav"><a href="/">Lab</a><a href="/hs">Hide &amp; Seek</a><a href="/learn" class="on">Learn</a></div>
  <div class="right"><span id="tutorTag"></span><span class="powered"><i></i>sandboxes on Archil</span></div>
</nav>

<main class="wrap">
  <div class="hero" id="hero">
    <div><h1>Learn stego</h1><p>Three hands-on lessons. Hide a secret yourself, see exactly what gives it away, then crack a mystery image with an AI tutor beside you.</p></div>
  </div>
  <div id="view"></div>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
};
const state = { level: null, step: "concept", hide: null, practice: null, photo: null };
const STEP_LABEL = { concept: "Concept", hide: "Hide", signals: "Signals", practice: "Practice", graduate: "Graduate" };
const tutorName = (d) => d.tutor === "claude" ? "Claude" : "scripted hints (no API key)";

async function picker() {
  const d = await api("/api/learn/lessons");
  $("#tutorTag").textContent = `tutor: ${tutorName(d)}`;
  $("#view").innerHTML = `<div class="picker">${Object.entries(d.lessons).map(([k, l]) =>
    `<a href="/learn/${k}"><div class="panel lesson"><div><span class="badge lvl-${k}">${k}</span></div><h3>${esc(l.title)}</h3><div class="teaser">${esc(l.concept[0] || "")}</div><div class="go">Start lesson →</div></div></a>`).join("")}</div>`;
}

async function lesson(level) {
  const d = await api("/api/learn/lessons");
  state.level = level; const L = d.lessons[level]; state.L = L;
  $("#tutorTag").textContent = `tutor: ${tutorName(d)}`;
  $("#hero").innerHTML = `<div><h1>${esc(L.title)} <span class="badge lvl-${esc(level)}" style="vertical-align:middle">${esc(level)}</span></h1></div><a class="btn ghost" href="/learn">All lessons</a>`;
  $("#view").innerHTML = `<div class="layout"><div>
      <div class="steps" id="stepper">${d.steps.map((s, i) => `<button data-s="${s}"><i>${i + 1}</i>${STEP_LABEL[s] || s}</button>`).join("")}</div>
      <div class="panel body" id="body"></div></div>
    <div class="panel sticky"><h2>AI tutor <span class="spacer">${tutorName(d)}</span></h2>
      <div class="chat" id="chat"><div class="msg">Ask me anything about this step.</div></div>
      <div class="row"><input type="text" id="q" placeholder="Ask for a hint…" class="grow" autocomplete="off"><button class="primary" id="ask">Ask</button></div></div></div>`;
  document.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => go(b.dataset.s));
  $("#ask").onclick = askTutor; $("#q").onkeydown = (e) => e.key === "Enter" && askTutor();
  go("concept");
}

function go(step) {
  state.step = step;
  document.querySelectorAll("[data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === step));
  ({ concept, hide, signals, practice, graduate })[step]();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function askTutor() {
  const q = $("#q").value.trim(); if (!q) return;
  const sid = state.practice?.meta.sid || state.hide?.meta.sid;
  const chat = $("#chat"); $("#q").value = "";
  chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div>`);
  if (!sid) { chat.insertAdjacentHTML("beforeend", `<div class="msg">Start the hide or practice step first, so I have an image to look at.</div>`); chat.scrollTop = chat.scrollHeight; return; }
  chat.insertAdjacentHTML("beforeend", `<div class="msg muted" id="thinking">thinking…</div>`); chat.scrollTop = chat.scrollHeight;
  try {
    const r = await api(`/api/learn/s/${sid}/tutor`, { message: q, step: state.step });
    $("#thinking").outerHTML = `<div class="msg">${esc(r.reply)}</div>`;
  } catch (e) { $("#thinking").outerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
  chat.scrollTop = chat.scrollHeight;
}

function concept() {
  const L = state.L;
  $("#body").innerHTML = `<h3>${esc(L.title)}</h3>${L.concept.map((p) => `<p>${esc(p)}</p>`).join("")}
    <h3>How it's done in the wild</h3>${L.in_the_wild.map((p) => `<p>${esc(p)}</p>`).join("")}
    <div class="next"><button class="primary" onclick="go('hide')">Next: hide something →</button></div>`;
}

function hide() {
  const h = state.hide;
  $("#body").innerHTML = `<h3>Hide a secret yourself</h3>
    <p class="muted">Pick any photo (or let us paint one), type a secret, and watch the exact pixels that change.</p>
    <label>Photo <span class="faint">(optional)</span></label><input type="file" id="file" accept="image/*">
    <label>Secret</label><input type="text" id="msg" maxlength="120" value="${esc(h?.truth?.message || "")}" placeholder="meet me at the fountain" autocomplete="off">
    <div class="row" style="margin-top:12px"><button class="primary" id="go">Hide it</button><span class="err" id="err"></span></div><div id="res"></div>`;
  $("#file").onchange = () => {
    const f = $("#file").files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"), k = Math.min(1, 1024 / Math.max(img.width, img.height));
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); state.photo = c.toDataURL("image/png"); };
    img.src = URL.createObjectURL(f);
  };
  $("#msg").onkeydown = (e) => e.key === "Enter" && $("#go").click();
  $("#go").onclick = async () => {
    $("#go").disabled = true; $("#err").textContent = "";
    try { state.hide = await api(`/api/learn/${state.level}/hide`, { message: $("#msg").value, photo_b64: state.photo }); showHide(); }
    catch (e) { $("#err").textContent = e.message; }
    $("#go").disabled = false;
  };
  if (h) showHide();
}

function showHide() {
  const h = state.hide, t = h.truth, s = t.spec;
  $("#res").innerHTML = `<div class="imgs">
      <figure><img src="${h.cover}"><figcaption>original</figcaption></figure>
      <figure><img src="${h.image}"><figcaption>with your secret</figcaption></figure>
      <figure><img src="${h.diff}"><figcaption>every changed pixel, in white</figcaption></figure></div>
    <div class="card mono small">${esc(s.technique)} · channels ${esc(s.channels.join(""))} · bit ${s.bit_plane} · ${esc(s.order)} · cipher ${esc(s.cipher)}${t.key ? ` · key “${esc(t.key)}” (${esc(s.key_source)})` : ""}</div>
    <div class="next"><button class="primary" onclick="go('signals')">Next: what gives it away →</button></div>`;
}

// Row profile: share of neighbouring pixels whose bit 0 differs, per band of rows. A fixed 0..0.6
// scale keeps channels and images comparable; the dashed line at 0.5 is what random bits give.
function spark(vals) {
  const mx = 0.6, w = 400, h = 40, y = (v) => (h - (Math.min(v, mx) / mx) * (h - 4) - 2).toFixed(1);
  const pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1) * w).toFixed(1)},${y(v)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="#6f6462" stroke-dasharray="4 4"/>` +
    `<polyline fill="none" stroke="#ca5551" stroke-width="1.5" points="${pts}"/></svg>`;
}

// One image's measurements: chi per channel, file structure, and the row profile for all three channels.
function readings(name, d) {
  const f = d.file;
  return `<div class="card reading"><b>${esc(name)}</b>
    <div class="mono">chi  R ${d.chi.R} · G ${d.chi.G} · B ${d.chi.B}</div>
    <div class="mono muted">chunks: ${esc(f.chunks.map((c) => c.type).join(" "))}${Object.keys(f.text).length ? "<br>text: " + esc(JSON.stringify(f.text)) : ""}<br>bytes after IEND: ${f.trailer_bytes}</div>
    <div class="muted small" style="margin-top:6px">row profile, bit 0 (dashed line = random bits)</div>
    ${["R", "G", "B"].map((c) => `<div class="row" style="flex-wrap:nowrap;gap:6px;margin-top:4px"><span class="mono small" style="width:12px">${c}</span><div style="flex:1">${spark(d.row_profile[c])}</div></div>`).join("")}</div>`;
}

const planeViewer = () => `<div class="imgframe" style="margin-top:10px;max-width:560px"><canvas id="cv" style="border:none;border-radius:0"></canvas></div>
  <div class="row" style="margin-top:8px"><span class="muted small">Bit-plane viewer</span><div class="seg">${["RGB", "R", "G", "B"].map((c) => `<button class="sm" data-ch="${c}">${c}</button>`).join("")}</div>
    <div class="seg">${[0, 1, 2].map((p) => `<button class="sm" data-pl="${p}">bit ${p}</button>`).join("")}</div><button class="sm ghost" data-orig>Show original</button></div>`;

async function signals() {
  if (!state.hide) { $("#body").innerHTML = `<div class="empty">Hide something first, then compare the measurements.<br><br><button onclick="go('hide')">Go to the hide step</button></div>`; return; }
  $("#body").innerHTML = `<p class="muted">measuring…</p>`;
  const sg = await api(`/api/learn/s/${state.hide.meta.sid}/signals`);
  $("#body").innerHTML = `<h3>Signals: before and after</h3><div class="imgs">${readings("original", sg.cover)}${readings("with secret", sg.stego)}</div>
    <h3>What to look for</h3>
    ${state.L.signals.map((s) => `<div class="card sig"><b>${esc(s.name)}</b><div>${esc(s.what)}</div><div class="muted small">${esc(s.why)}</div><div class="tool">${esc(s.tool)}</div></div>`).join("")}
    ${planeViewer()}
    <div class="next"><button class="primary" onclick="go('practice')">Next: crack a mystery image →</button></div>`;
  planes(state.hide.image);
}

function planes(src) {
  const img = new Image(); let ch = "RGB", pl = 0, pix, ctx;
  const mark = () => document.querySelectorAll("[data-ch],[data-pl]").forEach((b) => b.classList.toggle("on", b.dataset.ch === ch || b.dataset.pl === String(pl)));
  const draw = () => {
    const idx = { R: [0], G: [1], B: [2], RGB: [0, 1, 2] }[ch], out = new ImageData(pix.width, pix.height), d = out.data, s = pix.data;
    for (let i = 0; i < s.length; i += 4) {
      if (idx.length === 3) for (const j of idx) d[i + j] = ((s[i + j] >> pl) & 1) * 255;
      else d[i] = d[i + 1] = d[i + 2] = ((s[i + idx[0]] >> pl) & 1) * 255;
      d[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  };
  img.onload = () => { const cv = $("#cv"); cv.width = img.width; cv.height = img.height; ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0); pix = ctx.getImageData(0, 0, img.width, img.height); };  // starts on the original
  img.src = src;
  document.querySelectorAll("[data-ch]").forEach((b) => b.onclick = () => { ch = b.dataset.ch; if (pix) { draw(); mark(); } });
  document.querySelectorAll("[data-pl]").forEach((b) => b.onclick = () => { pl = +b.dataset.pl; if (pix) { draw(); mark(); } });
  $("[data-orig]").onclick = () => { if (pix) { ctx.putImageData(pix, 0, 0); document.querySelectorAll("[data-ch],[data-pl]").forEach((b) => b.classList.remove("on")); } };
}

async function practice() {
  if (!state.practice) { $("#body").innerHTML = `<p class="muted">building a mystery image…</p>`; state.practice = await api(`/api/learn/${state.level}/practice`, {}); }  // POST: creates the mystery image
  const p = state.practice, sid = p.meta.sid;
  $("#body").innerHTML = `<h3>Crack the mystery image</h3>
    <p class="muted">Same tools as the signals step, but there's no original to compare against this time.</p>
    ${planeViewer()}
    <div id="psig"><p class="muted">measuring…</p></div>
    <h3 class="sec">Decode</h3>
    <div class="field-grid">
      <div><label>Technique</label><select id="d-tech"><option>lsb</option><option>alpha</option><option>palette</option><option>dct</option></select></div>
      <div><label>Channels</label><select id="d-ch"><option>R,G,B</option><option>R</option><option>G</option><option>B</option><option>R,G</option><option>R,B</option><option>G,B</option></select></div>
      <div><label>Bit plane</label><select id="d-bp"><option>0</option><option>1</option><option>2</option></select></div>
      <div><label>Order</label><select id="d-ord"><option>sequential</option><option>prng</option></select></div>
      <div><label>Cipher</label><select id="d-ci"><option>none</option><option>xor</option><option>aes</option></select></div>
      <div><label>Key</label><input type="text" id="d-key" placeholder="(none)" autocomplete="off"></div></div>
    <div class="row" style="margin-top:12px"><button id="dtry">Try decode</button><button id="dwl">Try every wordlist key</button></div>
    <div class="out" id="dout"></div>
    <label style="margin-top:14px">Your answer</label><div class="row"><input type="text" id="ans" class="grow" autocomplete="off"><button class="primary" id="sub">Submit</button><button class="ghost" id="gu">Give up</button></div>
    <div class="out" id="aout"></div>`;
  planes(p.image);
  api(`/api/learn/s/${sid}/signals`).then((sg) => { $("#psig") && ($("#psig").innerHTML = readings("mystery image", sg.stego)); })
    .catch((e) => { $("#psig") && ($("#psig").textContent = e.message); });
  const spec = () => ({ technique: $("#d-tech").value, channels: $("#d-ch").value.split(","), bit_plane: +$("#d-bp").value, order: $("#d-ord").value, cipher: $("#d-ci").value });
  const dec = async (wordlist) => {
    $("#dout").textContent = "decoding…";
    try {
      const r = await api(`/api/learn/s/${sid}/try`, { spec: spec(), key: $("#d-key").value || null, wordlist });
      $("#dout").innerHTML = r.found ? `<span class="found">Found: ${esc(r.message)}</span>${r.key ? ` (key ${esc(r.key)})` : ""}` : r.error ? esc(r.error) : "nothing with those settings";
      if (r.found) $("#ans").value = r.message;
    } catch (e) { $("#dout").textContent = e.message; }
  };
  $("#dtry").onclick = () => dec(false); $("#dwl").onclick = () => dec(true);
  $("#ans").onkeydown = (e) => e.key === "Enter" && $("#sub").click();
  $("#sub").onclick = async () => {
    const r = await api(`/api/learn/s/${sid}/check`, { message: $("#ans").value });
    $("#aout").innerHTML = r.correct ? `<span class="found">Correct!</span> <button class="primary sm" onclick="go('graduate')">Next →</button>` : r.decoy ? `<span class="bad">That's a decoy.</span>` : "Not it. Ask the tutor for a nudge.";
  };
  $("#gu").onclick = async () => {
    const r = await api(`/api/learn/s/${sid}/giveup`, {});
    $("#aout").innerHTML = `The secret was <b>${esc(r.reveal.message)}</b> (${esc(r.reveal.spec.technique)}, channels ${esc(r.reveal.spec.channels.join(""))}, bit ${r.reveal.spec.bit_plane}, ${esc(r.reveal.spec.order)}, ${esc(r.reveal.spec.cipher)}${r.reveal.key ? `, key ${esc(r.reveal.key)}` : ""}). <button class="sm" onclick="go('graduate')">Next →</button>`;
  };
}

function graduate() {
  $("#body").innerHTML = `<h3>Ready for a real race?</h3>
    <p>Hide a secret at the <span class="badge lvl-${esc(state.level)}">${esc(state.level)}</span> level. Send the link to a friend: when they press start, the AI finder starts hunting too.</p>
    <label>Secret <span class="faint">(max 120 characters)</span></label><input type="text" id="gmsg" maxlength="120" placeholder="meet me at the fountain at 7" autocomplete="off">
    <label>Hint for the seekers <span class="faint">(optional; the AI sees it too)</span></label><input type="text" id="ghint" maxlength="200" autocomplete="off">
    <div class="row" style="margin-top:12px"><button class="primary" id="ggo">Create the race</button><span class="err" id="gerr"></span></div>
    <div id="gres"></div>`;
  $("#ggo").onclick = async () => {
    const message = $("#gmsg").value.trim();
    if (!message) { $("#gerr").textContent = "Type a secret first."; return; }
    $("#ggo").disabled = true; $("#gerr").textContent = "";
    try {
      const r = await api("/api/c", { message, level: state.level, hint: $("#ghint").value });
      const play = location.origin + r.play_url;
      $("#gres").innerHTML = `<div class="callout good" style="margin-top:14px"><b>Hidden.</b> Send this link to a friend.<label>Challenge link</label><input type="text" readonly value="${esc(play)}">
        <div class="row" style="margin-top:10px"><a class="btn primary sm" href="${esc(r.watch_url)}">Watch the race →</a><span class="muted small">or</span><a class="btn sm" href="${esc(r.play_url)}">Play it yourself</a></div></div>`;
    } catch (e) { $("#gerr").textContent = e.message; }
    $("#ggo").disabled = false;
  };
}

const m = location.pathname.match(/^\/learn\/(easy|medium|hard)/);
m ? lesson(m[1]) : picker();
</script>
</body>
</html>
